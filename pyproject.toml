[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bdu-asutp-mcp"
version = "0.1.0"
description = "MCP server for БДУ АСУ ТП ФСТЭК (Russian ICS threat database) over a local SQLite snapshot"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "D-Shapyrin" }]
keywords = ["mcp", "fstec", "bdu", "asutp", "ics", "scada", "threats"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "mcp>=1.0",
    "anyio>=4.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
bdu-asutp-mcp = "bdu_asutp_mcp._cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
